# Build app di động (Flutter) ra file APK Android.
#
# Chạy khi: push lên master có đổi thư mục mobile/, pull request, bấm tay (Actions > App Android > Run workflow),
# hoặc đẩy tag "mobile-v<phiên bản>" (vd mobile-v1.1.0) - lúc đó tạo luôn GitHub Release kèm APK.
#
# Ký bản phát hành: khai 4 secret ở Settings > Secrets and variables > Actions:
#   ANDROID_KEYSTORE_BASE64   nội dung file .jks mã hoá base64
#   ANDROID_KEYSTORE_PASSWORD mật khẩu keystore
#   ANDROID_KEY_ALIAS         alias của khoá
#   ANDROID_KEY_PASSWORD      mật khẩu khoá
# Thiếu secret thì APK ký bằng khoá debug của máy build - chỉ để thử, KHÔNG phát cho nhân viên (mỗi lần build một
# khoá khác nhau nên điện thoại không cài đè được bản mới).
#
# Thông báo đẩy (FCM): khai thêm secret GOOGLE_SERVICES_JSON_BASE64 (nội dung file
# mobile/android/app/google-services.json mã hoá base64, tải từ Firebase Console). Thiếu secret
# thì build vẫn qua bình thường, chỉ là APK đó không gửi/nhận được thông báo đẩy.

name: App Android

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
    tags:
      - 'mobile-v*'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # tạo GitHub Release khi đẩy tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # đúng bản trên máy dev
          channel: stable
          cache: true

      - name: Tải thư viện
        run: flutter pub get

      - name: Kiểm tra mã nguồn
        run: flutter analyze lib test

      - name: Chạy test
        run: flutter test

      - name: Tạo khoá ký từ GitHub Secrets
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Cảnh báo chưa có khoá ký
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Chưa khai secret ANDROID_KEYSTORE_BASE64 - APK ký bằng khoá debug, chỉ dùng để thử."

      - name: Tạo google-services.json từ GitHub Secrets (thông báo đẩy)
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Cảnh báo chưa có cấu hình Firebase
        if: env.GOOGLE_SERVICES_JSON_BASE64 == ''
        run: echo "::warning::Chưa khai secret GOOGLE_SERVICES_JSON_BASE64 - APK build lần này sẽ KHÔNG gửi/nhận được thông báo đẩy."

      - name: Build APK
        id: build
        run: |
          # Số bản build tăng dần theo lần chạy (Android cần versionCode tăng để cài đè).
          THAM_SO="--build-number=${{ github.run_number }}"
          TEN_BAN="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            TEN_BAN="${GITHUB_REF_NAME#mobile-v}"
            THAM_SO="$THAM_SO --build-name=$TEN_BAN"
          fi
          flutter build apk --release $THAM_SO
          TEN_FILE="quan-ly-san-xuat-${TEN_BAN}-b${{ github.run_number }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/$TEN_FILE"
          echo "file=mobile/build/$TEN_FILE" >> "$GITHUB_OUTPUT"
          echo "ten=$TEN_FILE" >> "$GITHUB_OUTPUT"

      - name: Lưu APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.ten }}
          path: ${{ steps.build.outputs.file }}
          retention-days: 30

      - name: Tạo GitHub Release (khi đẩy tag mobile-v*)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: App Android ${{ github.ref_name }}
          files: ${{ steps.build.outputs.file }}
          generate_release_notes: true
